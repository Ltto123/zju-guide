    </pattern>
    <pattern id="dense-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <circle cx="1.1" cy="1.1" r="1.05" fill="#46505C" opacity="0.3"/>
    </pattern>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
