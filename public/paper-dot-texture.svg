    <rect width="1600" height="320" fill="url(#fine-dots)" opacity="0.38"/>
    <rect width="1600" height="320" filter="url(#paper-grain)" opacity="0.42"/>
    <path d="M960 -40L1335 -40L1518 122L1282 350H900L1162 114Z" fill="url(#mid-dots)" opacity="0.5"/>
    <path d="M1260 -40L1615 -40V350H1450L1335 216L1530 35Z" fill="url(#dense-dots)" opacity="0.56"/>
    <path d="M1032 286L1238 80L1412 254L1308 358H1102Z" fill="none" stroke="#66717D" stroke-width="20" opacity="0.055"/>
    <path d="M1071 286L1238 119L1373 254L1294 333H1118Z" fill="url(#fine-dots)" opacity="0.5"/>
