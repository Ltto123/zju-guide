<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="micro-dots" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="0.75" cy="0.75" r="0.48" fill="#69727C" opacity="0.24"/>
    </pattern>
    <pattern id="fine-dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="translate(1 1)">
      <circle cx="1.2" cy="1.2" r="0.82" fill="#5F6873" opacity="0.24"/>
